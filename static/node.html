<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node details · KGQ Search</title>
  <style>
    :root {
      --accent: #1a73e8;
      --border: #dadce0;
      --muted: #5f6368;
      --card-border: #e1e4e8;
      --oi: #1a73e8;
      --rec: #188038;
      --gap: #e37400;
      --prj: #a142f4;
      --bg: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif;
      background: var(--bg); color: #202124;
      padding: 20px 16px 40px;
    }
    .container { max-width: 880px; margin: 0 auto; }
    .logo { font-size: 20px; letter-spacing: -1px; margin: 0 0 16px; font-weight: 400; }
    .logo b { color: var(--accent); }
    .logo a { color: inherit; text-decoration: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .back {
      border: 1px solid var(--border); background: #fff; color: #202124;
      border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .back:hover { background: #f1f3f4; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .badge {
      flex-shrink: 0; display: inline-block; min-width: 56px; text-align: center;
      font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
      color: #fff; border-radius: 12px; padding: 4px 10px;
    }
    .badge.oi { background: var(--oi); }
    .badge.rec { background: var(--rec); }
    .badge.gap { background: var(--gap); }
    .badge.prj { background: var(--prj); }
    .badge.ft { background: var(--muted); }
    .name { font-size: 20px; font-weight: 600; color: var(--accent); line-height: 1.35; }
    .section {
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .section h2 {
      margin: 0 0 10px; font-size: 13px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    }
    table.props { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.props td { padding: 6px 8px; vertical-align: top; border-top: 1px solid var(--card-border); }
    table.props td.k {
      width: 38%; color: var(--muted); font-size: 13px; font-weight: 600;
    }
    table.props td.v { overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-block; background: #e8f0fe; color: #174ea6;
      font-size: 12px; padding: 3px 10px; border-radius: 12px;
    }
    .empty { color: var(--muted); font-size: 13px; }
    .actor-list, .link-list { list-style: none; margin: 0; padding: 0; }
    .actor-list li { font-size: 14px; padding: 4px 0; }
    .link-item {
      display: block; border: 1px solid var(--card-border); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px; text-decoration: none; color: #202124;
    }
    .link-item:hover { background: #f8f9fa; border-color: var(--accent); }
    .link-item .l-badge { font-size: 11px; font-weight: 700; margin-right: 8px; }
    .l-badge.oi { color: var(--oi); } .l-badge.rec { color: var(--rec); } .l-badge.gap { color: var(--gap); } .l-badge.prj { color: var(--prj); }
    .link-item .l-title { font-weight: 600; color: var(--accent); }
    .link-item .l-snippet { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
    .link-item .l-rel { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .error { color: #d93025; text-align: center; padding: 40px 0; }
    .loading { color: var(--muted); text-align: center; padding: 40px 0; }
    .sub { font-size: 13px; color: var(--muted); }
    /* Overview rows (C2/A1/A2/A3a/A3b/C3/A4/actors) reuse the props table. */
    table.props td.v .tags { margin: 0; }
    table.props td.v .actor-list { margin: 0; }
    .url-item { font-size: 14px; padding: 3px 0; overflow-wrap: anywhere; }
    .url-item a { color: var(--accent); text-decoration: none; }
    .url-item a:hover { text-decoration: underline; }
    .rel-list { list-style: none; margin: 0; padding: 0; }
    .rel-item { font-size: 14px; padding: 5px 0; border-top: 1px solid var(--card-border); }
    .rel-list .rel-item:first-child { border-top: none; padding-top: 0; }
    .rel-item a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
    .rel-item a:hover { text-decoration: underline; }
    .rel-extra { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    details.more { margin-top: 6px; font-size: 13px; }
    details.more summary { cursor: pointer; color: var(--accent); }
    details.more .rel-list, details.more .url-item { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <button class="back" id="back-btn">&larr; Back</button>
      <div class="logo"><a href="index.html"><b>VCDB</b> Search</a></div>
    </div>
    <div id="content"><div class="loading">Loading&hellip;</div></div>
  </div>

  <script>
    // Same rule as index.html: dev static server (28080/8080) hits :28000
    // directly, any other origin goes same-origin through the reverse proxy.
    const API_BASE = (location.port === '28080' || location.port === '8080')
      ? location.protocol + '//' + location.hostname + ':28000'
      : '';
    const BADGE_CLASS = { 'Oggetto Informativo': 'oi', 'Raccomandazione': 'rec', 'Lacuna': 'gap', 'Progetto': 'prj', 'Full-text': 'ft' };
    const BADGE_SHORT = { 'Oggetto Informativo': 'OI', 'Raccomandazione': 'Rec', 'Lacuna': 'Gap', 'Progetto': 'Prj', 'Full-text': 'FT' };

    const PROP_LABELS = {
      officialTitle: 'Official Title',
      title: 'Title',
      subtitle: 'Subtitle',
      description: 'Description',
      findings: 'Findings',
      content: 'Content',
      motivation: 'Motivation',
      name: 'Name',
      id_num: 'Project ID',
      funding_source: 'Funding source',
      output_types: 'Output types',
      start_year: 'Start year',
      end_year: 'End year',
      start_month: 'Start month',
      end_month: 'End month',
      notes: 'Notes',
      decision_type: 'Decision type',
      conditions: 'Conditions',
      knowledge: 'Knowledge',
      policy: 'Policy',
      id: 'ID',
      releaseYear: 'Release year',
      releaseDate: 'Release date',
      grant: 'Grant',
      version: 'Version',
      versionDetails: 'Version details',
      submitted: 'Submitted',
      dateType: 'Date type',
      temporalType: 'Temporal type',
      temporalReference: 'Temporal reference',
      temporalResolution_0: 'Temporal resolution',
      spatial_type: 'Spatial type',
      spatial_scale: 'Spatial scale',
      spatial_resolution: 'Spatial resolution',
      coveredAreaDescription: 'Covered area',
      discrete_spatial_type: 'Discrete spatial type',
      discrete_points_insertion_mode: 'Discrete points insertion',
      validityPeriod: 'Validity period',
      forDecision: 'For decision',
      forRecommendation: 'For recommendation',
      expert_evaluation: 'Expert evaluation',
      internal_note: 'Internal note',
      internal_record_state: 'Internal record state',
      note: 'Note',
      future_work: 'Future work',
      intervals_year_month_1: 'Time intervals',
      // Related-node fields (they arrive in `related`, not in `properties`)
      URL: 'URL',
      url: 'URL',
      physicalArchive: 'Physical archive',
      email: 'Email',
      institution: 'Institution',
      surname: 'Surname',
      referencePerson: 'Reference person',
      acronym: 'Acronym',
      type: 'Type',
      action: 'Action',
      example: 'Example',
      full_text: 'Full text',
      details: 'Details',
      other_name: 'Other name',
    };

    const eid = new URLSearchParams(location.search).get('eid');

    document.getElementById('back-btn').addEventListener('click', goBack);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') goBack();
    });

    function goBack() {
      if (history.length > 1) history.back();
      else location.href = 'index.html';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function formatValue(v) {
      if (Array.isArray(v)) return esc(v.join(', '));
      if (v && typeof v === 'object') return esc(JSON.stringify(v));
      return esc(String(v == null ? '' : v));
    }

    function link(brief) {
      const label = brief.purposes && brief.purposes.length ? brief.purposes.join(', ') : '';
      const snippet = brief.title || brief.content || brief.description || 'No text';
      return '<a class="link-item" href="node.html?eid=' + encodeURIComponent(brief.eid) + '">' +
        '<span class="l-badge ' + (BADGE_CLASS[brief.type] || 'ft') + '">' + esc(BADGE_SHORT[brief.type] || 'FT') + '</span>' +
        '<span class="l-title">' + esc(brief.title || brief.content || brief.description || 'Node') + '</span>' +
        '<div class="l-snippet">' + esc(truncate(snippet, 180)) + '</div>' +
        (brief.rel ? '<div class="l-rel">Linked via ' + esc(brief.rel) + '</div>' : '') +
        (label ? '<div class="l-rel">Purpose: ' + esc(label) + '</div>' : '') +
        '</a>';
    }

    function truncate(s, n) {
      s = String(s == null ? '' : s);
      return s.length > n ? s.slice(0, n - 1) + '\u2026' : s;
    }

    async function load() {
      const content = document.getElementById('content');
      if (!eid) {
        content.innerHTML = '<div class="error">Missing node id (eid query param).</div>';
        return;
      }
      try {
        const res = await fetch(API_BASE + '/node/' + encodeURIComponent(eid));
        if (res.status === 404) throw new Error('Node not found');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        render(d);
      } catch (err) {
        content.innerHTML = '<div class="error">Failed to load node: ' + esc(String(err.message || err)) + '</div>';
      }
    }

    // Field order for the detail page: C2 title, A1 (Italian), A2 subtitle,
    // A3a abstract, A3b findings, grant, validity period, C3 URL/DOI, A4 main
    // purpose, secondary purpose, contributors split into people /
    // institutions - and only then everything else. The remaining own fields
    // render as "Additional Properties" below the connected Recs/Gaps, just
    // above "Assisted by / Reviewed by" and the embedding status.
    const OVERVIEW_URL_LIMIT = 10;
    const REL_LIST_LIMIT = 12;

    function render(d) {
      const badgeClass = BADGE_CLASS[d.type] || 'ft';
      const props = d.properties || {};
      const related = d.related || {};
      const isOI = (d.labels || []).includes('Contribution');
      const nodeName = nameOf(d);
      document.title = truncate(nodeName, 120) + ' \u00B7 KGQ Search';

      let html = '';
      html += '<div class="header">' +
        '<span class="badge ' + badgeClass + '">' + esc(BADGE_SHORT[d.type] || 'FT') + '</span>' +
        '<span class="name">' + esc(nodeName) + '</span>' +
        '</div>';

      // ---- 1. Overview, in the requested order ----------------------
      const overviewFields = [
        ['officialTitle', 'Official title (C2)'],
        ['title',         'Title (A1) \u00B7 Italian'],
        ['name',          'Name'],
        ['subtitle',      'Subtitle (A2)'],
        ['description',   isOI ? 'Abstract (A3a)' : 'Description'],
        ['findings',      'Findings (A3b)'],
        ['content',       'Content'],
        ['grant',         'Grant'],
        ['validityPeriod','Validity period'],
      ];
      const overviewKeys = new Set(overviewFields.map(([k]) => k));
      const overviewRows = [];
      overviewFields.forEach(([k, label]) => {
        const v = props[k];
        if (v == null || (typeof v === 'string' && !v.trim())) return;
        overviewRows.push('<tr><td class="k">' + esc(label) +
          '</td><td class="v">' + formatValue(v) + '</td></tr>');
      });

      // C3 URL/DOI: relationship-linked Reference nodes (not a property).
      const refs = (related.references && related.references.items) || [];
      if (refs.length) {
        overviewRows.push('<tr><td class="k">URL/DOI (C3)</td><td class="v">' +
          urlList(refs) + '</td></tr>');
      }

      // A4 main purpose (has_main_function) + its secondary functions.
      const mainPurposes = (d.mainPurposes && d.mainPurposes.length)
        ? d.mainPurposes
        : (d.purposes || []);
      if (mainPurposes.length) {
        overviewRows.push('<tr><td class="k">Main purpose (A4)</td><td class="v">' +
          tagList(mainPurposes) + '</td></tr>');
      }
      if (d.secPurposes && d.secPurposes.length) {
        overviewRows.push('<tr><td class="k">Secondary purpose</td><td class="v">' +
          tagList(d.secPurposes) + '</td></tr>');
      }

      // contributionActors, split by their ContributionActor.type.
      const actors = d.actors || [];
      const isInst = (a) => String(a.type || '').toLowerCase() === 'institution';
      const people = actors.filter((a) => !isInst(a));
      const insts = actors.filter(isInst);
      if (people.length) {
        overviewRows.push('<tr><td class="k">Contributors (people)</td><td class="v">' +
          actorList(people) + '</td></tr>');
      }
      if (insts.length) {
        overviewRows.push('<tr><td class="k">Contributors (institutions)</td><td class="v">' +
          actorList(insts) + '</td></tr>');
      }

      if (overviewRows.length) {
        html += '<div class="section"><h2>Details</h2><table class="props">' +
          overviewRows.join('') + '</table></div>';
      }

      // ---- 2. Everything else --------------------------------------
      // Rendered further down, after the connected Recs/Gaps.
      const propRows = Object.entries(props)
        .filter(([k]) => !isStatusKey(k) && !overviewKeys.has(k))
        .map(([k, v]) =>
          '<tr><td class="k">' + esc(PROP_LABELS[k] || k) + '</td><td class="v">' + formatValue(v) + '</td></tr>'
        ).join('');
      const vectorRows = Object.entries(d.vectorProps || {}).map(([k, dim]) =>
        '<tr><td class="k">' + esc(PROP_LABELS[k] || k) + '</td><td class="v">' + dim + '-dim vector</td></tr>'
      ).join('');

      // Remaining relationship-linked fields, in the backend's display order.
      // (`references` is the C3 row, `user` renders at the bottom as
      // "Assisted by" / "Reviewed by".)
      Object.keys(related).forEach((key) => {
        if (key === 'references' || key === 'user') return;
        const group = related[key];
        if (!group || !group.items || !group.items.length) return;
        html += '<div class="section"><h2>' + esc(group.label) + '</h2>' +
          itemList(group.items) + '</div>';
      });

      // Parent OI (for Rec/Gap)
      if (d.parents && d.parents.length) {
        html += '<div class="section"><h2>Parent OI</h2>' + d.parents.map(link).join('') + '</div>';
      }

      // Connected Recs/Gaps (for OI)
      if (d.children && d.children.length) {
        const recs = d.children.filter(c => c.type === 'Raccomandazione');
        const gaps = d.children.filter(c => c.type === 'Lacuna');
        if (recs.length) {
          html += '<div class="section"><h2>Connected Recommendations (' + recs.length + ')</h2>' + recs.map(link).join('') + '</div>';
        }
        if (gaps.length) {
          html += '<div class="section"><h2>Connected Gaps (' + gaps.length + ')</h2>' + gaps.map(link).join('') + '</div>';
        }
        if (!recs.length && !gaps.length) {
          html += '<div class="section"><h2>Connected Recs / Gaps</h2><div class="empty">No Rec/Gap linked to this OI.</div></div>';
        }
      }

      // Remaining own properties: below the connected Recs/Gaps, above
      // "Assisted by / Reviewed by".
      if (propRows || vectorRows) {
        html += '<div class="section"><h2>Additional Properties</h2><table class="props">' +
          propRows + vectorRows + '</table></div>';
      } else if (!overviewRows.length) {
        html += '<div class="section"><div class="empty">No stored properties.</div></div>';
      }

      // Assisted by / Reviewed by, then the embedding bookkeeping: the very
      // bottom of the page (after the connected Recs/Gaps).
      const assisted = (related.user && related.user.items) || [];
      html += '<div class="section"><h2>Assisted by / Reviewed by</h2><table class="props">' +
        '<tr><td class="k">Assisted by</td><td class="v">' +
        (assisted.length ? itemList(assisted) : '<span class="sub">Nobody recorded yet.</span>') +
        '</td></tr>' +
        '<tr><td class="k">Reviewed by</td><td class="v">' +
        '<span class="sub">No reviewer recorded yet.</span>' +
        '</td></tr>' +
        '</table></div>';

      // Statuses (embeddings bookkeeping, small)
      const statusRows = Object.entries(props).filter(([k]) => isStatusKey(k));
      if (statusRows.length) {
        html += '<div class="section"><h2>Embedding status</h2><table class="props">' +
          statusRows.map(([k, v]) => '<tr><td class="k">' + esc(k) + '</td><td class="v">' + esc(v) + '</td></tr>').join('') +
          '</table></div>';
      }

      html += '<div class="sub">db_id: ' + esc(d.eid) + '</div>';
      document.getElementById('content').innerHTML = html;
    }

    // `embeddingStatus` (Rec/Gap/Project) and `*EmbeddingStatus` (Contribution).
    function isStatusKey(k) {
      return /embeddingStatus$/i.test(k);
    }

    function tagList(items) {
      return '<div class="tags">' +
        items.map(p => '<span class="tag">' + esc(p) + '</span>').join('') + '</div>';
    }

    // The row label already says people/institutions, so no type suffix here.
    function actorList(actors) {
      return '<ul class="actor-list">' +
        actors.map(a => '<li>' + esc(a.name) + '</li>').join('') + '</ul>';
    }

    // Only http(s) links are clickable; anything else renders as plain text.
    function safeHref(url) {
      const u = String(url == null ? '' : url).trim();
      return /^https?:\/\//i.test(u) ? u : '';
    }

    function plainValue(v) {
      if (Array.isArray(v)) return v.join(', ');
      if (v && typeof v === 'object') return JSON.stringify(v);
      return String(v == null ? '' : v);
    }

    // `showLabel` is for rows whose heading is the URL itself, where the
    // Reference name is still worth keeping as a caption.
    function extraLine(item, showLabel) {
      const bits = [];
      if (showLabel && item.label && item.label !== item.url) bits.push(item.label);
      Object.keys(item.props || {}).forEach((k) => {
        bits.push((PROP_LABELS[k] || k) + ': ' + truncate(plainValue(item.props[k]), 160));
      });
      return bits.length
        ? '<div class="rel-extra">' + esc(bits.join(' \u00B7 ')) + '</div>'
        : '';
    }

    function urlList(items) {
      const head = items.slice(0, OVERVIEW_URL_LIMIT);
      const rest = items.slice(OVERVIEW_URL_LIMIT);
      let out = head.map(urlItem).join('');
      if (rest.length) {
        out += '<details class="more"><summary>Show ' + rest.length + ' more</summary>' +
          rest.map(urlItem).join('') + '</details>';
      }
      return out;
    }

    function urlItem(item) {
      const href = safeHref(item.url);
      if (href) {
        return '<div class="url-item">' +
          '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(item.url) + '</a>' +
          extraLine(item, true) + '</div>';
      }
      // No usable URL (e.g. a physical archive only): plain text + its details.
      return '<div class="url-item">' + esc(item.label || '') + extraLine(item, false) + '</div>';
    }

    function itemList(items) {
      const head = items.slice(0, REL_LIST_LIMIT);
      const rest = items.slice(REL_LIST_LIMIT);
      let out = '<ul class="rel-list">' + head.map(relItem).join('') + '</ul>';
      if (rest.length) {
        out += '<details class="more"><summary>Show ' + rest.length + ' more</summary>' +
          '<ul class="rel-list">' + rest.map(relItem).join('') + '</ul></details>';
      }
      return out;
    }

    function relItem(item) {
      const href = safeHref(item.url);
      const head = href
        ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(item.label) + '</a>'
        : esc(item.label);
      return '<li class="rel-item">' + head + extraLine(item) + '</li>';
    }

    function nameOf(d) {
      const p = d.properties || {};
      return p.officialTitle || p.title || p.content || p.name || p.description || 'Unnamed node';
    }

    load();
  </script>
</body>
</html>
