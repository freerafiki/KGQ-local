<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node details · KGQ Search</title>
  <!-- Page styles live next to the markup (like app.css on index.html). -->
  <link rel="stylesheet" href="node.css">
</head>
<body>
  <!-- Inline icon sprite: Icons: lucide-static v0.544.0 (ISC License) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ic-paper" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></symbol>
    <symbol id="ic-model" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /> <path d="m3.3 7 8.7 5 8.7-5" /> <path d="M12 22V12" /></symbol>
    <symbol id="ic-plan" viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" /> <path d="M15 5.764v15" /> <path d="M9 3.236v15" /></symbol>
    <symbol id="ic-law" viewBox="0 0 24 24"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" /> <path d="m16 16 6-6" /> <path d="m21.5 10.5-8-8" /> <path d="m8 8 6-6" /> <path d="m8.5 7.5 8 8" /></symbol>
    <symbol id="ic-dataset" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3" /> <path d="M3 5V19A9 3 0 0 0 21 19V5" /> <path d="M3 12A9 3 0 0 0 21 12" /></symbol>
    <symbol id="ic-rec" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /> <path d="M9 18h6" /> <path d="M10 22h4" /></symbol>
    <symbol id="ic-gap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /> <path d="M12 17h.01" /></symbol>
    <symbol id="ic-prj" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /> <rect width="20" height="14" x="2" y="6" rx="2" /></symbol>
    <symbol id="ic-oi" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /></symbol>
    <symbol id="ic-ft" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></symbol>
  </svg>

  <!-- #app is the Vue mount point (see js/node-page.js).
       The markup below is the ROOT COMPONENT'S TEMPLATE: Vue compiles it at
       mount, so the dynamic parts carry v-* directives instead of being
       written by hand in JS. Repeated pieces (linked-node cards, related
       lists, URL rows) are child components; everything else is plain static
       markup. The page's view model — field order, limits, link targets —
       lives in js/node-page.js.
       No build step: Vue is vendored in static/vendor/ and imported as an ES
       module, so the page is still served as static files. -->
  <div class="container" id="app" v-cloak>
    <div class="topbar">
      <button class="back" type="button" @click="goBack">&larr; Back</button>
      <div class="logo"><a href="index.html"><b>VCDB</b> Search</a></div>
    </div>

    <div v-if="phase === 'loading'" class="loading">Loading&hellip;</div>
    <div v-else-if="phase === 'error'" class="error">{{ error }}</div>
    <template v-else>
      <!-- Badge = the node's document type; when known, it drills into the
           matching Doc Type filter on the search page. -->
      <div class="header">
        <a v-if="header.badgeHref" class="badge" :class="header.badgeClass" :href="header.badgeHref">
          <svg class="bic" aria-hidden="true"><use :href="'#ic-' + header.badgeClass"></use></svg>{{ header.badgeText }}
        </a>
        <span v-else class="badge" :class="header.badgeClass">
          <svg class="bic" aria-hidden="true"><use :href="'#ic-' + header.badgeClass"></use></svg>{{ header.badgeText }}
        </span>
        <span class="name">{{ header.name }}</span>
      </div>

      <!-- 1. Details: overview fields in the requested order, then C3
           URL/DOI, purposes and contributors. Purpose chips link to the
           Purpose facet, contributor names to an Authors-mode search. -->
      <div v-if="detailsRows.length" class="section">
        <h2>Details</h2>
        <table class="props">
          <tr v-for="row in detailsRows" :key="row.label">
            <td class="k">{{ row.label }}</td>
            <td class="v">
              <template v-if="row.kind === 'text'">{{ row.value }}</template>
              <div v-else-if="row.kind === 'tags'" class="tags">
                <a v-for="t in row.items" :key="t.label" class="tag" :class="t.cls" :href="t.href">{{ t.label }}</a>
              </div>
              <ul v-else-if="row.kind === 'actors'" class="actor-list">
                <li v-for="a in row.items" :key="a.name">
                  <a v-if="a.href" :href="a.href">{{ a.name }}</a><template v-else>{{ a.name }}</template>
                </li>
              </ul>
              <template v-else-if="row.kind === 'urls'">
                <url-item v-for="(u, i) in row.items" :key="i" :item="u"></url-item>
                <details v-if="row.more.length" class="more">
                  <summary>Show {{ row.more.length }} more</summary>
                  <url-item v-for="(u, i) in row.more" :key="i" :item="u"></url-item>
                </details>
              </template>
            </td>
          </tr>
        </table>
      </div>

      <!-- 2. Related groups (Environment, Geographic area, Formal type, ...),
           in the backend's display order. Entities link to their node page;
           external documents open in a new tab; the Formal type section
           drills into the Doc Type facet. -->
      <div v-for="s in relatedSections" :key="s.key" class="section">
        <h2>{{ s.title }}</h2>
        <rel-list :items="s.items"></rel-list>
        <details v-if="s.more.length" class="more">
          <summary>Show {{ s.more.length }} more</summary>
          <rel-list :items="s.more"></rel-list>
        </details>
      </div>

      <!-- 3. Linked node cards: parent document, connected Recs/Gaps. -->
      <div v-for="s in linkSections" :key="s.key" class="section">
        <h2>{{ s.title }}</h2>
        <link-card v-for="(item, i) in s.items" :key="item.href + i" :item="item"></link-card>
        <div v-if="s.empty" class="empty">{{ s.empty }}</div>
      </div>

      <!-- 4. Remaining own fields, below the connected Recs/Gaps. -->
      <div v-if="extraRows.length" class="section">
        <h2>Additional Properties</h2>
        <table class="props">
          <tr v-for="row in extraRows" :key="row.label">
            <td class="k">{{ row.label }}</td>
            <td class="v"><a v-if="row.href" :href="row.href">{{ row.value }}</a><template v-else>{{ row.value }}</template></td>
          </tr>
        </table>
      </div>
      <div v-else-if="!detailsRows.length" class="section">
        <div class="empty">No stored properties.</div>
      </div>

      <!-- 5. Assisted by / Reviewed by, at the very bottom of the page. -->
      <div class="section">
        <h2>Assisted by / Reviewed by</h2>
        <table class="props">
          <tr>
            <td class="k">Assisted by</td>
            <td class="v">
              <template v-if="assisted.items.length || assisted.more.length">
                <rel-list :items="assisted.items"></rel-list>
                <details v-if="assisted.more.length" class="more">
                  <summary>Show {{ assisted.more.length }} more</summary>
                  <rel-list :items="assisted.more"></rel-list>
                </details>
              </template>
              <span v-else class="sub">Nobody recorded yet.</span>
            </td>
          </tr>
          <tr>
            <td class="k">Reviewed by</td>
            <td class="v"><span class="sub">No reviewer recorded yet.</span></td>
          </tr>
        </table>
      </div>

      <div class="sub">db_id: {{ data.eid }}</div>
    </template>
  </div>

  <script type="module" src="js/node-page.js"></script>
</body>
</html>
