<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGQ Search</title>
  <!-- Page styles live next to the markup (node.html has its own node.css). -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Inline icon sprite: Icons: lucide-static v0.544.0 (ISC License) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ic-paper" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></symbol>
    <symbol id="ic-model" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /> <path d="m3.3 7 8.7 5 8.7-5" /> <path d="M12 22V12" /></symbol>
    <symbol id="ic-plan" viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" /> <path d="M15 5.764v15" /> <path d="M9 3.236v15" /></symbol>
    <symbol id="ic-law" viewBox="0 0 24 24"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" /> <path d="m16 16 6-6" /> <path d="m21.5 10.5-8-8" /> <path d="m8 8 6-6" /> <path d="m8.5 7.5 8 8" /></symbol>
    <symbol id="ic-dataset" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3" /> <path d="M3 5V19A9 3 0 0 0 21 19V5" /> <path d="M3 12A9 3 0 0 0 21 12" /></symbol>
    <symbol id="ic-rec" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /> <path d="M9 18h6" /> <path d="M10 22h4" /></symbol>
    <symbol id="ic-gap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /> <path d="M12 17h.01" /></symbol>
    <symbol id="ic-prj" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /> <rect width="20" height="14" x="2" y="6" rx="2" /></symbol>
    <symbol id="ic-oi" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /></symbol>
    <symbol id="ic-ft" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></symbol>
  </svg>

  <!-- #app is the Vue mount point (see js/search-page.js).
       The markup below is the ROOT COMPONENT'S TEMPLATE: Vue compiles it at
       mount, so the dynamic parts carry v-* directives instead of being
       written by hand in JS. Repeated pieces (cards, contributor facets) are
       child components; everything else is plain static markup.
       No build step: Vue is vendored in static/vendor/ and imported as an ES
       module, so the page is still served as static files. -->
  <div class="container" id="app" v-cloak>
    <div class="logo"><b>V<span class="small-title">enice</span>C<span class="small-title">limate</span>D<span class="small-title">ata</span>B<span class="small-title">ase</span></b> Search<sup class="tag">prototype</sup></div>

    <!-- Search mode switcher (ARIA tabs, DeepL-style pill row). Selecting a
         tab re-runs the query already on screen, so the selected tab and the
         shown results never disagree. Roving tabindex: arrows move selection. -->
    <div class="mode-tabs" role="tablist" aria-label="Search mode" @keydown="onTabKeydown">
      <button v-for="m in modeEntries" :key="m.value" type="button" role="tab" class="mode-tab"
              :id="'tab-' + m.value"
              :aria-selected="mode === m.value ? 'true' : 'false'"
              aria-controls="results-panel"
              :tabindex="mode === m.value ? 0 : -1"
              @click="selectMode(m.value)">{{ m.label }}</button>
    </div>

    <form @submit.prevent="search()" autocomplete="off">
      <div class="searchbar">
        <svg focusable="false" height="20" viewBox="0 0 24 24" width="20">
          <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"></path>
        </svg>
        <input ref="qInput" v-model="query" type="text" placeholder="Search the venice climate database..." aria-label="Search">
        <button class="btn btn-primary" type="submit" :disabled="phase === 'loading'">Search</button>
      </div>
    </form>

    <div class="layout">
      <aside class="col-filters">
        <div class="filter-panel">
          <h3 class="panel-title">Filters</h3>

          <details class="filter-group">
            <summary>Doc Type</summary>
            <div class="group-body">
              <!-- A Contribution is filtered through its FormalType: these 5
                   entries ARE its document type (every Contribution has
                   exactly one), so one shows iff a ticked entry matches its
                   badge. Project joins them as the 6th box: a document-ish
                   node type of its own. The (N) after each label counts the
                   results of THIS search carrying that entry — the whole
                   result set, independent of the other filters. -->
              <label class="chk" v-for="f in formalEntries" :key="f.value"><input type="checkbox" v-model="formal[f.value]"> <span class="dot" :class="f.dot"></span> {{ f.value }} ({{ counts.formal[f.value] }})</label>
              <label class="chk" v-for="t in projectEntries" :key="t.value"><input type="checkbox" v-model="types[t.value]"> <span class="dot" :class="t.dot"></span> {{ t.label }} ({{ counts.type[t.value] }})</label>
            </div>
          </details>

          <!-- The types that attach TO a document (Indication, Gap): opting
               in to them is an extra, so they live apart from the document
               types they hang on. Same `types` axis in the filter chain —
               only the rendering and the ?include= URL param split. -->
          <details class="filter-group">
            <summary>Include also</summary>
            <div class="group-body">
              <label class="chk" v-for="t in includeEntries" :key="t.value"><input type="checkbox" v-model="types[t.value]"> <span class="dot" :class="t.dot"></span> {{ t.label }} ({{ counts.type[t.value] }})</label>
            </div>
          </details>

          <details class="filter-group">
            <summary>Main purpose</summary>
            <div class="group-body">
              <!-- Main-purpose filter: the payload only carries MAIN purposes
                   (query_util), so ticking here narrows by primary intent.
                   Second line = Purpose.name from the graph (category prefix
                   stripped where the name starts with it); entries come from
                   PURPOSE_ENTRIES in js/state.js and their values MUST stay the
                   taxonomy labels from query_util.PURPOSE_CATEGORIES. -->
              <label class="chk" v-for="p in purposeEntries" :key="p.value"><input type="checkbox" v-model="purposes[p.value]"> <span class="dot" :class="p.dot"></span><span class="chk-text">{{ p.value }} ({{ counts.purpose[p.value] }})<span class="chk-desc">{{ p.desc }}</span></span></label>
            </div>
          </details>

          <!-- Time: dual-bound slider over the year range of the current
               results (hidden while no result carries a year). A bound never
               crosses the other. Docs WITHOUT a year are governed by the
               checkbox below the slider. The narrowed range is written to
               ?year= (the node page's Release year link drills into it). -->
          <details class="filter-group" v-if="yearDomain.min !== null">
            <summary>Time</summary>
            <div class="group-body">
              <div class="year-readout">{{ yearFrom }} &#8211; {{ yearTo }}</div>
              <div class="range-slider">
                <div class="range-track"></div>
                <div class="range-fill" :style="rangeFill"></div>
                <input type="range" class="range-input" :min="yearDomain.min" :max="yearDomain.max" step="1"
                       :value="yearFrom" :style="{ zIndex: yearFrom > (yearDomain.min + yearDomain.max) / 2 ? 4 : 2 }"
                       @input="setYearFrom($event)" aria-label="Lower year bound">
                <input type="range" class="range-input" :min="yearDomain.min" :max="yearDomain.max" step="1"
                       :value="yearTo" style="z-index: 3"
                       @input="setYearTo($event)" aria-label="Upper year bound">
              </div>
              <label class="chk"><input type="checkbox" v-model="year.showMissing"> show docs without year</label>
            </div>
          </details>

          <actor-facet facet="person"></actor-facet>
          <actor-facet facet="institution"></actor-facet>

          <details class="filter-group">
            <summary>Advanced parameters</summary>
            <div class="group-body adv-body">
              <label>source_k
                <input type="number" v-model.number="source_k" min="1">
              </label>
              <label>final_k
                <input type="number" v-model.number="final_k" min="1">
              </label>
              <label>rrf_constant
                <input type="number" v-model.number="rrf_constant" min="1">
              </label>
            </div>
          </details>
        </div>

        <!-- Search summary below the Filters card (keeps the results column
             full-width). Shown only after a successful search or restore:
             while loading/failed the old page cleared it too. -->
        <h3 class="section-title">Results Summary</h3>
        <div class="meta">
          <template v-if="phase === 'done'">
            {{ searchPrefix }}<div class="meta-q">“{{ submittedQuery }}”</div>
            <div> showing {{ countText }}</div>
            <div> took {{ embedTime }}s to embed the query string</div>
            <div> took {{ searchTime }}s to search the VCDB</div>
          </template>
        </div>
        <footer>KGQ search prototype</footer>
      </aside>

      <section class="col-results">
        <!-- The mode tabs control this panel (labelled by the active tab). -->
        <div class="results" id="results-panel" role="tabpanel" :aria-labelledby="'tab-' + mode">
          <div v-if="phase === 'loading'" class="loading">Searching…</div>
          <div v-else-if="phase === 'error'" class="error">Search failed: {{ error }}</div>
          <template v-else-if="phase === 'done'">
            <div v-if="!visible.length" class="empty">No results found.</div>
            <template v-else>
              <!-- A group = a parent document's card plus its Rec/Gap children
                   nested underneath; a result without a visible parent is a
                   group with no children. -->
              <template v-for="g in groups" :key="g.key">
                <result-card v-if="g.root" :result="g.root" :ft-min="ft[0]" :ft-max="ft[1]" @open="openNode"></result-card>
                <div v-if="g.children.length" class="child-group">
                  <result-card v-for="c in g.children" :key="c.neo4j_id" :result="c" :nested="!!g.root" :ft-min="ft[0]" :ft-max="ft[1]" @open="openNode"></result-card>
                </div>
              </template>
            </template>
          </template>
          <!-- phase === 'idle': nothing has been searched yet, the column is empty -->
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/search-page.js"></script>
</body>
</html>
